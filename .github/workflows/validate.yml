name: Validate interview coach
on:
  workflow_dispatch:
  push:
    paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "Makefile"
      - "plugin.mk"
      - "docs.mk"
      - "docs/**"
      - "README*.md"
      - "LICENSE"
      - "install.sh"
      - "plugin.json"
      - "assets/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - ".github/workflows/validate.yml"
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "Makefile"
      - "plugin.mk"
      - "docs.mk"
      - "docs/**"
      - "README*.md"
      - "LICENSE"
      - "install.sh"
      - "plugin.json"
      - "assets/**"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run stdlib tests
        run: make test
      - name: Validate and build plugin distributions
        run: |
          make check-plugin
          make package
      - name: Validate and build documentation export
        run: |
          make check-docs-export
          make export-docs
