name: Validate interview coach
on:
  workflow_dispatch:
  push:
    paths:
      - ".claude/skills/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - ".claude/skills/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run stdlib tests
        run: python -m unittest discover -s tests -v
